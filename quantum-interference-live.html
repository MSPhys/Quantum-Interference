<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Measured Interference</title>
<style>
  :root{ --bg:#06080d; --fg:#e6ecf5; --dim:#848ea0; --accent:#6ea8ff; --line:#1b2230; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#eef1f7; --fg:#10141e; --dim:#5a6476; --accent:#2a5fc9; --line:#d6dbe6; }
  }
  :root[data-theme="dark"]{ --bg:#06080d; --fg:#e6ecf5; --dim:#848ea0; --accent:#6ea8ff; --line:#1b2230; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{max-width:100%;max-height:100%;image-rendering:pixelated;}
  .hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:16px 18px;
    display:flex;justify-content:space-between;gap:12px;pointer-events:none;}
  .hud *{pointer-events:auto;}
  .panel{background:color-mix(in srgb, var(--bg) 82%, transparent);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px);}
  h1{font-size:13px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:11px;color:var(--dim);max-width:270px;line-height:1.5;}
  button{font-family:inherit;font-size:12px;background:var(--fg);color:var(--bg);border:none;
    border-radius:6px;padding:7px 11px;font-weight:600;cursor:pointer;}
  .stat{font-size:11px;color:var(--dim);text-align:right;}
  .stat b{color:var(--accent);}
  @media (max-width:560px){ .sub{display:none;} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="260" height="260" style="width:900px;height:900px;"></canvas></div>
<div class="hud">
  <div class="panel">
    <h1>Measured Interference</h1>
    <div class="sub">Several wave sources, each one's position, frequency and phase set by quantum measurement, summed into one interference field. Re-measures automatically, live, every few seconds.</div>
    <button id="regen" style="margin-top:8px;">Re-measure now</button>
  </div>
  <div class="panel stat">
    sources <b id="scount">0</b><br>
    measurements <b id="mcount">0</b><br>
    source <b id="src">classical (demo)</b>
  </div>
</div>
<script>
(function(){
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var N = 260; // internal resolution, scaled up via CSS for crisp interference bands

  // LIVE version: calls a local/deployed backend (server.py) which itself
  // calls Moth's real coin-toss-v1 API and returns a fresh batch of measured
  // bits. Requires running `python server.py` (or the deployed URL) -- see
  // server.py / README.md for setup.
  var REAL_BITS = [], realIdx = 0;
  var measurementCount = 0;
  var fetching = false;

  function rawBit(){
    measurementCount++;
    if(realIdx < REAL_BITS.length) return REAL_BITS[realIdx++];
    return Math.random() < 0.5 ? 1 : 0; // fallback only if a live fetch hasn't landed yet
  }
  function measureBit(prob){
    if(prob===undefined) prob = 0.5;
    var v=0, scale=0.5;
    for(var i=0;i<10;i++){ v += rawBit()*scale; scale/=2; }
    return v < prob ? 1 : 0;
  }
  function measureUnit(bits){
    bits = bits||8; var v=0; for(var i=0;i<bits;i++) v=v*2+rawBit();
    return v/(Math.pow(2,bits)-1);
  }

  async function fetchFreshBits(){
    fetching = true;
    try{
      var r = await fetch('/api/measure');
      var d = await r.json();
      if(d.bits){ REAL_BITS = d.bits; realIdx = 0; fetching = false; return d; }
      else { console.error(d); fetching = false; return null; }
    }catch(e){
      fetching = false;
      return null;
    }
  }

  var PALETTE = [[110,168,255],[255,140,170],[140,255,200],[255,210,110]];

  function makeSources(){
    var k = 3 + Math.floor(measureUnit(2)*4); // 3–6 sources, itself quantum-chosen
    var sources = [];
    for(var i=0;i<k;i++){
      sources.push({
        x: measureUnit()*N,
        y: measureUnit()*N,
        freq: 0.08 + measureUnit()*0.22,       // spatial frequency
        phase: measureUnit()*Math.PI*2,
        amp: 0.6 + measureUnit()*0.4,
        col: PALETTE[i % PALETTE.length]
      });
    }
    return sources;
  }

  // --- continuous live animation + auto re-measurement ---
  var pageStart = performance.now();
  var currentSources = [], prevSources = [];
  var lastMeasureT = 0;
  var transitionDur = 900;   // ms to crossfade between old and new pattern
  var animSpeed = 0.0022;    // phase units per ms -- how fast the ripple moves
  var jobsCalled = 0;

  // Raw wave field for ONE set of sources at time t -- no canvas write yet,
  // so two fields can be blended together for a smooth crossfade.
  function computeField(sources, t){
    var buf = new Float32Array(N*N*3);
    for(var y=0;y<N;y++){
      for(var x=0;x<N;x++){
        var r=0,g=0,b=0,wsum=0;
        for(var s=0;s<sources.length;s++){
          var src = sources[s];
          var dx = x-src.x, dy = y-src.y;
          var dist = Math.sqrt(dx*dx+dy*dy);
          var effPhase = src.phase + t*animSpeed;
          var wave = Math.sin(dist*src.freq - effPhase) * src.amp;
          var w = Math.max(0, wave);
          r += src.col[0]*w; g += src.col[1]*w; b += src.col[2]*w; wsum += w;
        }
        var norm = wsum>0 ? 1/Math.max(1,wsum*0.6) : 0;
        var idx = (y*N+x)*3;
        buf[idx]=Math.min(255,r*norm); buf[idx+1]=Math.min(255,g*norm); buf[idx+2]=Math.min(255,b*norm);
      }
    }
    return buf;
  }

  function drawFrame(t){
    if(!currentSources.length) return;
    var elapsed = t - lastMeasureT;
    var newField = computeField(currentSources, t);
    var img = ctx.createImageData(N, N);

    if(elapsed < transitionDur && prevSources.length){
      var oldField = computeField(prevSources, t);
      var alpha = elapsed/transitionDur; // 0 = all old, 1 = all new
      for(var i=0;i<N*N;i++){
        var p=i*3, q=i*4;
        img.data[q]   = oldField[p]  *(1-alpha) + newField[p]  *alpha;
        img.data[q+1] = oldField[p+1]*(1-alpha) + newField[p+1]*alpha;
        img.data[q+2] = oldField[p+2]*(1-alpha) + newField[p+2]*alpha;
        img.data[q+3] = 255;
      }
    } else {
      for(var i=0;i<N*N;i++){
        var p=i*3, q=i*4;
        img.data[q]=newField[p]; img.data[q+1]=newField[p+1]; img.data[q+2]=newField[p+2]; img.data[q+3]=255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // A real measurement: genuine API call, fresh sources, old ones kept for
  // the crossfade so the transition is smooth rather than a hard cut.
  async function liveRender(){
    if(fetching) return;
    document.getElementById('src').textContent = 'measuring live…';
    var d = await fetchFreshBits();
    if(!d){ document.getElementById('src').textContent = 'server not reachable'; return; }

    measurementCount = 0;
    prevSources = currentSources;
    currentSources = makeSources();
    lastMeasureT = performance.now() - pageStart;
    jobsCalled++;

    document.getElementById('scount').textContent = currentSources.length;
    document.getElementById('mcount').textContent = measurementCount;
    document.getElementById('src').textContent =
      'quantum LIVE (' + d.backend + ') — jobs called: ' + jobsCalled;
  }

  document.getElementById('regen').addEventListener('click', liveRender);

  (function loop(now){
    drawFrame(now - pageStart);
    requestAnimationFrame(loop);
  })(performance.now());

  liveRender();                   // first real measurement on load
  setInterval(liveRender, 6000);  // then automatically, every 6 seconds
})();
</script>
</body>
</html>

  // coin-toss-v1 is a FAIR coin (no bias parameter). A biased decision is built

  function rawBit(){
    measurementCount++;
    if(realIdx < REAL_BITS.length) return REAL_BITS[realIdx++];
    return Math.random() < 0.5 ? 1 : 0; // only reached if 2000 real bits run out
  }

    if(prob===undefined) prob = 0.5;
    var v=0, scale=0.5;
    for(var i=0;i<10;i++){ v += rawBit()*scale; scale/=2; }
